<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="EVO Liga, a mascote da liga semanal">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#F2A93B"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9A07A"/><stop offset="1" stop-color="#C48660"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#00F5CE" stop-opacity="0.28"/><stop offset="1" stop-color="#00F5CE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="120" cy="150" rx="118" ry="128" fill="url(#glow)"/>
  <!-- trophy raised -->
  <g transform="translate(150 18)">
    <path d="M14 10h40v18c0 14-9 24-20 24S14 42 14 28z" fill="url(#gold)" stroke="#B87A1C" stroke-width="2"/>
    <path d="M14 16H5c0 12 6 18 12 19M54 16h9c0 12-6 18-12 19" fill="none" stroke="#E5A23A" stroke-width="4" stroke-linecap="round"/>
    <rect x="29" y="51" width="10" height="10" fill="#E5A23A"/>
    <rect x="21" y="60" width="26" height="8" rx="2" fill="#2A2F36"/>
    <path d="M34 20l3 6 6 1-4.5 4 1 6-5.5-3-5.5 3 1-6-4.5-4 6-1z" fill="#FFF6D0"/>
  </g>
  <!-- sparkles -->
  <path d="M40 46l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#00F5CE"/>
  <path d="M212 120l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#FFE27A"/>
  <!-- back hair -->
  <g fill="#2B1A12">
    <circle cx="72" cy="112" r="26"/><circle cx="168" cy="112" r="26"/>
    <circle cx="64" cy="148" r="24"/><circle cx="176" cy="148" r="24"/>
    <circle cx="70" cy="182" r="20"/><circle cx="170" cy="182" r="20"/>
  </g>
  <!-- body / jacket -->
  <path d="M68 270c0-44 22-66 52-66s52 22 52 66z" fill="#15181C"/>
  <path d="M120 206v64" stroke="#00F5CE" stroke-width="3"/>
  <path d="M96 210c-6 18-10 38-10 60M144 210c6 18 10 38 10 60" stroke="#00F5CE" stroke-width="3" fill="none"/>
  <path d="M104 206l16 22 16-22" fill="#0B0D10"/>
  <text x="120" y="246" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">EVO<tspan fill="#00F5CE">+</tspan></text>
  <!-- raised arm holding trophy -->
  <path d="M158 224c16-16 25-60 25-124" stroke="#15181C" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M166 220c12-16 19-56 19-114" stroke="#00F5CE" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="184" cy="90" r="11" fill="url(#skin)"/>
  <path d="M176 84c4-3 12-3 16 0" stroke="#C48660" stroke-width="3" stroke-linecap="round" fill="none"/>
