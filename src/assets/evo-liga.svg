  </g>
  <!-- face -->
  <ellipse cx="100" cy="142" rx="7.5" ry="9" fill="#1B120D"/><ellipse cx="140" cy="142" rx="7.5" ry="9" fill="#1B120D"/>
  <circle cx="102.5" cy="138.5" r="2.6" fill="#FFFFFF"/><circle cx="142.5" cy="138.5" r="2.6" fill="#FFFFFF"/>
  <path d="M90 127c5-4 12-4 17-1M133 126c5-3 12-3 17 1" stroke="#2B1A12" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="88" cy="160" rx="8" ry="5" fill="#E07A6A" opacity="0.45"/><ellipse cx="152" cy="160" rx="8" ry="5" fill="#E07A6A" opacity="0.45"/>
  <path d="M106 164c8 10 20 10 28 0" stroke="#7A2E22" stroke-width="3.5" stroke-linecap="round" fill="#FFFFFF"/>
