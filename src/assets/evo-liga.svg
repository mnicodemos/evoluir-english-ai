  <g fill="#2B1A12">
    <path d="M68 132c-2-44 24-70 52-70s54 26 52 70c-8-20-22-30-36-34-6 10-24 16-40 14-12 6-22 12-28 20z"/>
    <circle cx="86" cy="84" r="16"/><circle cx="110" cy="72" r="17"/><circle cx="136" cy="72" r="17"/><circle cx="158" cy="86" r="16"/>
    <circle cx="70" cy="104" r="13"/><circle cx="172" cy="106" r="13"/>
  </g>
  <g fill="none" stroke="#5A3A27" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
