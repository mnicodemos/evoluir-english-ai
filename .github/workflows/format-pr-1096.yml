name: Format PR 1096
on:
  push:
    branches:
      - feat/reactivation-email-automation
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reactivation-email-automation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format files from PR 1096
        run: |
          bunx prettier --write \
            src/components/ProfileMenu.tsx \
            src/lib/email-templates/reactivation.tsx \
            src/lib/focusInvitationPreference.ts \
            src/routes/api/public/cron/reactivation-emails.ts \
            src/routes/api/public/reactivation-unsubscribe.ts
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/ProfileMenu.tsx src/lib/email-templates/reactivation.tsx src/lib/focusInvitationPreference.ts src/routes/api/public/cron/reactivation-emails.ts src/routes/api/public/reactivation-unsubscribe.ts
            git commit -m "style: format reactivation email files with Prettier"
            git push origin HEAD:feat/reactivation-email-automation
          fi
