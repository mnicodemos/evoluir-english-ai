name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require test credentials (no silent skips)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || '' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || '' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || '' }}
          SECURITY_USER_B_EMAIL: ${{ secrets.SECURITY_USER_B_EMAIL || '' }}
          SECURITY_USER_B_PASSWORD: ${{ secrets.SECURITY_USER_B_PASSWORD || '' }}
        run: |
          missing=""
          for v in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY E2E_USER_EMAIL E2E_USER_PASSWORD SECURITY_USER_B_EMAIL SECURITY_USER_B_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing CI secrets/variables:$missing (cross-user and authenticated E2E would be skipped)"
            exit 1
          fi
          echo "All test credentials present."
          # Format check only — values are never printed.
          if ! printf '%s' "$SUPABASE_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$'; then
            echo "::error::vars.SUPABASE_URL is set but is not a valid URL (expected https://<project>.supabase.co, no quotes, spaces or path)."
            exit 1
          fi
          echo "SUPABASE_URL format: valid"

      - name: Backend reachability diagnostic (safe, no values printed)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || '' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || '' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || '' }}
          SECURITY_USER_B_EMAIL: ${{ secrets.SECURITY_USER_B_EMAIL || '' }}
          SECURITY_USER_B_PASSWORD: ${{ secrets.SECURITY_USER_B_PASSWORD || '' }}
        run: |
          yn() { [ -n "$1" ] && echo yes || echo no; }
          echo "SUPABASE_URL present: $(yn "$SUPABASE_URL")"
          case "$SUPABASE_URL" in https://*) echo "URL is HTTPS: yes";; *) echo "URL is HTTPS: no";; esac
          host=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://([^/:]+).*#\1#')
          echo "Hostname: $host"
          echo "Publishable key present: $(yn "$SUPABASE_PUBLISHABLE_KEY")"
          echo "Key prefix ok (sb_publishable_ or JWT): $(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | grep -Eq '^(sb_publishable_|eyJ)' && echo yes || echo no)"
          echo "User A email/password present: $(yn "$E2E_USER_EMAIL")/$(yn "$E2E_USER_PASSWORD")"
          echo "User B email/password present: $(yn "$SECURITY_USER_B_EMAIL")/$(yn "$SECURITY_USER_B_PASSWORD")"
          echo "DNS lookup:"; getent hosts "$host" >/dev/null && echo "  resolves: yes" || echo "  resolves: no"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "https://$host/auth/v1/health" || echo "000")
          echo "Auth health HTTP status: $code (000 = network/DNS failure)"

      - uses: oven-sh/setup-bun@v2

      - name: Dependency audit (js-yaml effective version)
        run: |
          bun install --frozen-lockfile
          bun pm why js-yaml --top
          # Full report is always printed; HIGH/CRITICAL fail the build.
          # Known moderate (documented): esbuild@0.18.20 via drizzle-kit ->
          # @esbuild-kit/core-utils (dev-only, pins ~0.18; GHSA-67mh-4wv8-2f99).
          bun audit || true
          bun audit --audit-level=high



      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Unit tests (Vitest)
        # Includes tests/security/cross-user.test.ts: student A must never read
        # student B's data (both test accounts live in the repository secrets).
        run: bun run test
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || '' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || '' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || '' }}
          SECURITY_USER_B_EMAIL: ${{ secrets.SECURITY_USER_B_EMAIL || '' }}
          SECURITY_USER_B_PASSWORD: ${{ secrets.SECURITY_USER_B_PASSWORD || '' }}

      - name: Build
        run: bun run build

      - name: E2E tests (Playwright)
        # Public, security and smoke specs block the build. The signed-in
        # specs run in the next step.
        run: |
          bunx playwright install chromium --with-deps
          bun run e2e --grep-invert "authenticated smoke"
        env:
          # Publishable backend values; CI relies on the tracked .env for now —
          # move these into repository secrets when .env leaves version control.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || '' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || '' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || '' }}
          SECURITY_USER_B_EMAIL: ${{ secrets.SECURITY_USER_B_EMAIL || '' }}
          SECURITY_USER_B_PASSWORD: ${{ secrets.SECURITY_USER_B_PASSWORD || '' }}

      - name: E2E signed-in tests
        # Signs in with the test account and walks the student screens; a
        # broken screen now fails the build.
        run: bun run e2e --grep "authenticated smoke"
        env:
          # Publishable backend values; CI relies on the tracked .env for now —
          # move these into repository secrets when .env leaves version control.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || '' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || '' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || '' }}
          SECURITY_USER_B_EMAIL: ${{ secrets.SECURITY_USER_B_EMAIL || '' }}
          SECURITY_USER_B_PASSWORD: ${{ secrets.SECURITY_USER_B_PASSWORD || '' }}

      - name: Show signed-in E2E page snapshots
        # The page as the test saw it (accessibility tree) when a signed-in
        # check fails, so the cause is visible in the log. Secrets stay masked.
        if: failure()
        run: |
          for f in $(find test-results -name error-context.md 2>/dev/null | head -6); do
            echo "::group::$f"
            head -c 6000 "$f"
            echo
            echo "::endgroup::"
          done
