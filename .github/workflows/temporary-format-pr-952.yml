name: Temporary Prettier fix for PR 952

on:
  push:
    branches:
      - fix/admin-panel-complete-english-audit

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-panel-complete-english-audit
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format only the files changed by PR 952
        run: |
          bunx prettier --write \
            src/components/AdminCreditBalance.tsx \
            src/components/AdminFinancialProjection.tsx \
            src/components/AdminLessonCaptions.tsx \
            src/components/AdminLevelIntroVideos.tsx \
            src/components/AdminMistakeReview.tsx \
            src/components/AdminPremiumVideos.tsx \
            src/components/AdminRecoveryPoints.tsx \
            src/components/AdminRetention.tsx \
            src/components/AdminSpeakingWait.tsx \
            src/components/AdminVideoComments.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminCreditBalance.tsx src/components/AdminFinancialProjection.tsx src/components/AdminLessonCaptions.tsx src/components/AdminLevelIntroVideos.tsx src/components/AdminMistakeReview.tsx src/components/AdminPremiumVideos.tsx src/components/AdminRecoveryPoints.tsx src/components/AdminRetention.tsx src/components/AdminSpeakingWait.tsx src/components/AdminVideoComments.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style(admin): apply Prettier formatting"
          git push origin HEAD:fix/admin-panel-complete-english-audit
