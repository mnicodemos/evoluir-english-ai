name: Temporary Prettier fix for PR 1040

on:
  push:
    branches:
      - feat/new-student-welcome-email

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/new-student-welcome-email'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/new-student-welcome-email
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Format files reported by CI
        run: |
          bunx prettier --write \
            src/components/AdminEmailCampaigns.tsx \
            src/lib/admin.functions.ts \
            src/lib/email-templates/premium-benefits.tsx \
            src/lib/email-templates/premium-welcome.tsx \
            src/lib/email-templates/welcome.tsx \
            src/lib/welcomeEmail.functions.ts \
            src/routes/_authenticated/admin.tsx
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/AdminEmailCampaigns.tsx \
            src/lib/admin.functions.ts \
            src/lib/email-templates/premium-benefits.tsx \
            src/lib/email-templates/premium-welcome.tsx \
            src/lib/email-templates/welcome.tsx \
            src/lib/welcomeEmail.functions.ts \
            src/routes/_authenticated/admin.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "fix: format email campaign changes for CI"
          git push origin HEAD:feat/new-student-welcome-email
